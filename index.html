<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>DRM TRADE</title>
<style>
:root{--bg:#0b0f14;--p:#111821;--b:#1e2a38;--g:#2ecc71;--r:#e74c3c;--y:#f1c40f;--t:#e6edf3;--m:#7d8b99}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:ui-monospace,Menlo,Consolas,monospace;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tag{font-size:10px;color:var(--g);border:1px solid var(--g);border-radius:6px;padding:1px 6px;margin-left:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:6px;animation:k 1.6s infinite}
@keyframes k{50%{opacity:.25}}
#suara{background:var(--p);color:var(--m);border:1px solid var(--b);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.st{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px}
.st span{display:block;font-size:10px;color:var(--m);letter-spacing:.5px}
.st b{font-size:20px}
.st small{margin-left:6px;font-size:11px}
.card{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--p);color:var(--m);font:inherit;font-size:12px}
.tabs button.on{background:var(--g);color:#000;font-weight:bold;border-color:var(--g)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b)}
.up{color:var(--g)}.down{color:var(--r)}
.sec{display:none}.sec.on{display:block}
small{color:var(--m)}
.sig{padding:7px 0;border-bottom:1px solid var(--b)}
.sig .a{display:flex;justify-content:space-between;align-items:center}
.bd{font-size:10px;padding:1px 7px;border-radius:6px;margin-left:8px;color:#000;font-weight:bold}
.b-dibeli{background:var(--g)}.b-ditolak{background:var(--r);color:#fff}.b-nyaris{background:var(--y)}
.baru{animation:m 1.2s ease-out}
@keyframes m{0%{opacity:0;transform:translateY(-10px);background:#1c2f24}100%{opacity:1;transform:none;background:transparent}}
.ag{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ah b{font-size:12px;letter-spacing:.5px}
.at{font-size:10px;border:1px solid;border-radius:6px;padding:1px 6px}
</style></head>
<body>
<div class="top">
<div><span class="dot"></span><b style="font-size:18px">DRM TRADE</b><span class="tag">PAPER</span></div>
<button id="suara" onclick="toggleSuara()">🔇 Suara</button>
</div>

<div class="grid">
<div class="st"><span>PNL HARI INI</span><b id="pnl">$0.00</b></div>
<div class="st"><span>PNL TOTAL</span><b id="tot">$0.00</b></div>
<div class="st"><span>MENANG / KALAH</span><b id="wl">0 / 0</b><small id="wr"></small></div>
<div class="st"><span>POSISI TERBUKA</span><b id="np">0</b></div>
</div>

<div class="card"><small>KURVA PNL (KUMULATIF)</small>
<svg id="kurva" viewBox="0 0 300 80" width="100%"></svg></div>

<div class="tabs">
<button class="on" onclick="tab('pos',this)">Posisi</button>
<button onclick="tab('his',this)">History</button>
<button onclick="tab('live',this)">Live</button>
  <button onclick="tab('agen',this)">Agen</button>
</div>

<div id="pos" class="sec on card"></div>
<div id="his" class="sec card"></div>
<div id="live" class="sec card">
<div style="margin-bottom:8px"><span class="dot"></span><small id="liveinfo">Memuat sinyal...</small></div>
<div id="feed"></div>
</div>
  <div id="agen" class="sec"></div>
<small id="status">Memuat data...</small>

<script>
const SUPABASE_URL='https://qehuvoyfimfwijrmbpxc.supabase.co';
const SUPABASE_KEY='sb_publishable_WAlE9s4GwxiqoFbAQRBeWQ_jn6KdzLU';
const tg=Telegram.WebApp;tg.ready();tg.expand();
let suaraOn=false,ac=null,tutupLihat=null,sudahLihat=null;

function tab(id,btn){
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('on'));
  document.getElementById(id).classList.add('on');btn.classList.add('on');
}
function fmt(n){const v=Number(n)||0;return (v>=0?'+':'-')+'$'+Math.abs(v).toFixed(2);}
function cls(n){return Number(n)>=0?'up':'down';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lalu(iso){
  const d=Math.max(0,Math.round((Date.now()-new Date(iso))/1000));
  if(d<60)return d+' dtk lalu';
  if(d<3600)return Math.round(d/60)+' mnt lalu';
  return Math.round(d/3600)+' jam lalu';
}
async function ambil(path){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:SUPABASE_KEY}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}

function toggleSuara(){
  suaraOn=!suaraOn;
  if(suaraOn){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){suaraOn=false;}}
  document.getElementById('suara').textContent=suaraOn?'🔔 Suara':'🔇 Suara';
  if(suaraOn)bunyi('beli');
}
function nada(f,mulai,dur){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,ac.currentTime+mulai);
  g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+mulai+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+mulai+dur);
  o.connect(g);g.connect(ac.destination);
  o.start(ac.currentTime+mulai);o.stop(ac.currentTime+mulai+dur+0.05);
}
function bunyi(j){
  if(!suaraOn||!ac)return;
  try{
    if(j==='beli'){nada(660,0,0.12);nada(880,0.14,0.18);}
    else if(j==='untung'){nada(784,0,0.12);nada(988,0.12,0.12);nada(1319,0.24,0.25);}
    else{nada(330,0,0.2);nada(247,0.2,0.3);}
  }catch(e){}
}

function kurva(closed){
  const el=document.getElementById('kurva');
  const s=closed.filter(t=>t.closed_at).sort((a,b)=>new Date(a.closed_at)-new Date(b.closed_at));
  if(s.length<2){el.innerHTML='<text x="150" y="45" fill="#7d8b99" font-size="11" text-anchor="middle">Menunggu data trade</text>';return;}
  let c=0;const v=[0];
  s.forEach(t=>{c+=Number(t.pnl_usd)||0;v.push(c);});
  const mn=Math.min(...v,0),mx=Math.max(...v,0),r=(mx-mn)||1;
  const x=i=>2+(i/(v.length-1))*296,y=n=>76-((n-mn)/r)*70;
  const pts=v.map((n,i)=>x(i).toFixed(1)+','+y(n).toFixed(1)).join(' ');
  const w=v[v.length-1]>=0?'#2ecc71':'#e74c3c';
  el.innerHTML='<line x1="0" x2="300" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="#1e2a38" stroke-dasharray="3"/><polyline points="'+pts+'" fill="none" stroke="'+w+'" stroke-width="2" stroke-linejoin="round"/>';
}

function render(rows){
  const open=rows.filter(t=>t.status==='open');
  const closed=rows.filter(t=>t.status!=='open');
  const idTutup=new Set(closed.map(t=>t.id));
  if(tutupLihat){for(const t of closed){if(!tutupLihat.has(t.id)){
    const u=Number(t.pnl_usd)>=0;bunyi(u?'untung':'rugi');
    try{tg.HapticFeedback.notificationOccurred(u?'success':'error');}catch(e){}
  }}}
  tutupLihat=idTutup;

  const today=new Date().toDateString();
  const sum=a=>a.reduce((x,t)=>x+(Number(t.pnl_usd)||0),0);
  const pt=sum(closed.filter(t=>t.closed_at&&new Date(t.closed_at).toDateString()===today));
  const tot=sum(closed);
  const w=closed.filter(t=>Number(t.pnl_usd)>0).length,l=closed.length-w;
  const e1=document.getElementById('pnl');e1.textContent=fmt(pt);e1.className=cls(pt);
  const e2=document.getElementById('tot');e2.textContent=fmt(tot);e2.className=cls(tot);
  document.getElementById('wl').textContent=w+' / '+l;
  document.getElementById('wr').textContent=closed.length?Math.round(w/closed.length*100)+'%':'';
  document.getElementById('np').textContent=open.length;
  kurva(closed);

  document.getElementById('pos').innerHTML=open.length
    ?open.map(t=>'<div class="row"><span>'+esc(t.token_symbol)+' <small>$'+Number(t.size_usd).toFixed(0)+' | sisa '+Number(t.remaining_pct).toFixed(0)+'%</small></span><span>@ '+esc(t.entry_price)+'</span></div>').join('')
    :'<small>Belum ada posisi terbuka.</small>';
  document.getElementById('his').innerHTML=closed.length
    ?closed.map(t=>'<div class="row"><span>'+esc(t.token_symbol)+' <small>'+esc(t.exit_reason||'')+'</small></span><span class="'+cls(t.pnl_usd)+'">'+fmt(t.pnl_usd)+'</span></div>').join('')
    :'<small>Belum ada history trade.</small>';
}

function renderFeed(rows){
  let ada=false;
  const html=rows.map(s=>{
    const baru=sudahLihat&&!sudahLihat.has(s.id);
    if(baru&&s.decision==='dibeli')ada=true;
    let u='<small>menunggu 5m</small>';
    if(s.price_5m!==null&&s.price_5m!==undefined){
      if(Number(s.price_5m)===0)u='<span class="down">hilang</span>';
      else{const p=(Number(s.price_5m)/Number(s.price)-1)*100;u='<span class="'+cls(p)+'">'+(p>=0?'+':'')+p.toFixed(1)+'% (5m)</span>';}
    }
    return '<div class="sig'+(baru?' baru':'')+'"><div class="a"><span>'+esc(s.token_symbol||'?')+'<span class="bd b-'+esc(s.decision)+'">'+esc(s.decision)+'</span></span><span>'+u+'</span></div><small>'+esc(s.reason||'lolos semua aturan')+' · '+lalu(s.created_at)+'</small></div>';
  }).join('');
  document.getElementById('feed').innerHTML=html||'<small>Belum ada sinyal.</small>';
  document.getElementById('liveinfo').textContent=rows.length?'Sinyal terakhir '+lalu(rows[0].created_at)+' · '+rows.length+' terbaru':'Belum ada sinyal';
  sudahLihat=new Set(rows.map(s=>s.id));
  if(ada){bunyi('beli');try{tg.HapticFeedback.notificationOccurred('success');}catch(e){}}
}

async function load(){
  const [a,b]=await Promise.allSettled([
    ambil('trades?select=*&order=opened_at.desc&limit=200'),
    ambil('signals?select=id,created_at,token_symbol,decision,reason,price,price_5m&order=created_at.desc&limit=40'),
  ]);
  const err=[];
  if(a.status==='fulfilled')render(a.value);else err.push('trades: '+a.reason.message);
  if(b.status==='fulfilled')renderFeed(b.value);else err.push('sinyal: '+b.reason.message);
  document.getElementById('status').textContent=err.length?'Gagal memuat '+err.join(', '):'Diperbarui '+new Date().toLocaleTimeString('id-ID');
}
load();
setInterval(load,10000);
 function kartuAgen(nama,tag,warna,b1,b2){
  return '<div class="ag"><div class="ah"><b>'+nama+'</b><span class="at" style="color:'+warna+';border-color:'+warna+'">'+tag+'</span></div><div>'+b1+'</div><small>'+b2+'</small></div>';
}
async function muatAgen(){
  try{
    const sejak=new Date(Date.now()-24*3600000).toISOString();
    const rows=await ambil('signals?select=decision,created_at,rug_score&created_at=gte.'+sejak+'&order=created_at.desc&limit=1000');
    const n=rows.length;
    const dibeli=rows.filter(s=>s.decision==='dibeli').length;
    const ditolak=rows.filter(s=>s.decision==='ditolak').length;
    const nyaris=rows.filter(s=>s.decision==='nyaris').length;
    const rugIsi=rows.filter(s=>s.rug_score!==null).length;
    const menit=n?(Date.now()-new Date(rows[0].created_at))/60000:9999;
    const terakhir=n?lalu(rows[0].created_at):'-';
    const hijau='#2ecc71',kuning='#f1c40f',abu='#7d8b99';
    const hidup=menit<30;
    const tagBot=hidup?'AKTIF':'SEPI';
    const warnaBot=hidup?hijau:kuning;
    const np=document.getElementById('np').textContent;
    const tot=document.getElementById('tot').textContent;
    document.getElementById('agen').innerHTML=
      kartuAgen('SCANNER',tagBot,warnaBot,n+' sinyal tercatat / 24 jam','terakhir '+terakhir+' · '+nyaris+' nyaris, '+dibeli+' dibeli')
      +kartuAgen('VERIFIKASI SILANG',tagBot,warnaBot,ditolak+' ditolak / 24 jam','cek likuiditas dan harga di DexScreener')
      +kartuAgen('RUG CHECK','BELUM AKTIF',abu,rugIsi+' sinyal sudah dianalisis (uji)','belum dipasang di bot, masih tahap pengujian')
      +kartuAgen('SIZER','TETAP',hijau,'$25 per posisi · maks 5 posisi','belum berbasis modal')
      +kartuAgen('EXECUTOR','SIMULASI',hijau,np+' posisi terbuka','slippage simulasi 3% masuk dan keluar')
      +kartuAgen('LOGGER',tagBot,warnaBot,n+' keputusan / 24 jam','tiap sinyal dicatat beserta alasannya')
      +kartuAgen('EQUITY','PNL',abu,tot,'dari trade yang sudah ditutup');
  }catch(e){
    document.getElementById('agen').innerHTML='<small>Gagal memuat agen: '+esc(e.message)+'</small>';
  }
}
muatAgen();
setInterval(muatAgen,20000); 
</script>
</body></html>
