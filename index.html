<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>DRM TRADE</title>
<style>
body{margin:0;background:#0e1117;color:#fff;font-family:sans-serif;padding:16px}
h2{text-align:center;margin:0 0 12px}
.card{background:#1a1f2b;border-radius:12px;padding:14px;margin-bottom:12px}
.big{font-size:32px;font-weight:bold;color:#2ecc71}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#1a1f2b;color:#aaa;font-size:14px}
.tabs button.on{background:#2ecc71;color:#000;font-weight:bold}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3040}
.up{color:#2ecc71}.down{color:#e74c3c}
.sec{display:none}.sec.on{display:block}
small{color:#777}
</style></head>
<body>
<h2>DRM TRADE</h2>

<div class="card">
<div style="color:#aaa">PnL Hari Ini</div>
<div class="big" id="pnl">$0.00</div>
<small id="total"></small>
</div>

<div class="tabs">
<button class="on" onclick="tab('pos',this)">Posisi Terbuka</button>
<button onclick="tab('his',this)">History</button>
</div>

<div id="pos" class="sec on card"></div>
<div id="his" class="sec card"></div>

<small id="status">Memuat data...</small>

<script>
const SUPABASE_URL = 'https://qehuvoyfimfwijrmbpxc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WAlE9s4GwxiqoFbAQRBeWQ_jn6KdzLU';

const tg = Telegram.WebApp; tg.ready(); tg.expand();

function tab(id, btn){
  document.querySelectorAll('.sec').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  btn.classList.add('on');
}
function fmt(n){const v=Number(n)||0;return (v>=0?'+':'-')+'$'+Math.abs(v).toFixed(2);}
function cls(n){return Number(n)>=0?'up':'down';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function render(rows){
  const open = rows.filter(t=>t.status==='open');
  const closed = rows.filter(t=>t.status!=='open');
  const today = new Date().toDateString();
  const pnlToday = closed
    .filter(t=>t.closed_at && new Date(t.closed_at).toDateString()===today)
    .reduce((a,t)=>a+(Number(t.pnl_usd)||0),0);
  const pnlTotal = closed.reduce((a,t)=>a+(Number(t.pnl_usd)||0),0);

  const el = document.getElementById('pnl');
  el.textContent = fmt(pnlToday);
  el.className = 'big ' + cls(pnlToday);
  document.getElementById('total').textContent =
    'Total: ' + fmt(pnlTotal) + ' dari ' + closed.length + ' trade';

  document.getElementById('pos').innerHTML = open.length
    ? open.map(t=>'<div class="row"><span>'+esc(t.token_symbol)+' <small>$'+Number(t.size_usd).toFixed(0)+' | sisa '+Number(t.remaining_pct).toFixed(0)+'%</small></span><span>@ '+esc(t.entry_price)+'</span></div>').join('')
    : '<small>Belum ada posisi terbuka.</small>';

  document.getElementById('his').innerHTML = closed.length
    ? closed.map(t=>'<div class="row"><span>'+esc(t.token_symbol)+' <small>'+esc(t.exit_reason||'')+'</small></span><span class="'+cls(t.pnl_usd)+'">'+fmt(t.pnl_usd)+'</span></div>').join('')
    : '<small>Belum ada history trade.</small>';
}

async function load(){
  try{
    const r = await fetch(
      SUPABASE_URL + '/rest/v1/trades?select=*&order=opened_at.desc&limit=200',
      { headers: { apikey: SUPABASE_KEY } }
    );
    if(!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
    document.getElementById('status').textContent =
      'Diperbarui ' + new Date().toLocaleTimeString('id-ID');
  }catch(e){
    document.getElementById('status').textContent = 'Gagal memuat data: ' + e.message;
  }
}
load();
setInterval(load, 15000);
</script>
</body></html>
